aid: hexagon-bio
name: Hexagon Bio
description: 'Hexagon Bio is a Menlo Park, California biotechnology company developing novel payloads for
  antibody-drug conjugates (ADCs) in oncology. The company designs next-generation ADC payloads intended
  to overcome resistance to current payloads and to expand the range of cancer indications ADCs can treat.
  Backed by SoftBank Vision Fund, Hexagon Bio operates a therapeutics pipeline and research platform rather
  than a public developer program: it publishes no API, SDK, or developer documentation surface. This
  profile was surfaced as a portfolio-company lead and enriched from Hexagon Bio''s own public website
  (company, pipeline, science/platform, and news pages).'
